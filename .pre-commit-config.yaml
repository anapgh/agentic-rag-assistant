repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3          # se actualiza solo con: uv run pre-commit autoupdate
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0          # pre-commit autoupdate lo pone al día
    hooks:
      - id: gitleaks

# Después: uv run pre-commit autoupdate && uv run pre-commit install.

